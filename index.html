<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diário de Bordo · Ressurgência 2026</title>
<style>
  :root {
    --brand:        #b3492f;
    --brand-dark:   #8a371f;
    --brand-wash:   #f6e9e4;
    --ink:          #201e1f;
    --mid:          #6b6a6d;
    --wash:         #ececec;
    --paper:        #ffffff;
    --page:         #faf7f5;
    --line:         #e6e1dd;
    --danger:       #c0453a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--page);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 6px; background: var(--wash); z-index: 20;
  }
  .topbar .fill { height: 100%; background: var(--brand); width: 0%; transition: width .4s ease; }

  .brandbar {
    position: fixed; top: 6px; left: 0; right: 0; z-index: 19;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; background: rgba(250,247,245,0.92); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .brandbar .brandleft { display: flex; align-items: center; gap: 12px; }
  .brandbar .logo-img { height: 30px; width: auto; display: block; }
  .brandbar .brandname { font-weight: 800; font-size: 14.5px; letter-spacing: -0.01em; }
  .brandbar .brandname small { display: block; font-weight: 600; font-size: 11.5px; color: var(--mid); letter-spacing: .02em; }
  .brandbar .step-lbl { font-size: 12.5px; color: var(--mid); font-weight: 600; }

  .stage {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 110px 20px 40px;
  }
  .card {
    width: 100%; max-width: 680px;
    opacity: 0; transform: translateY(14px);
    animation: rise .5s ease forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--brand-dark); background: var(--brand-wash); padding: 5px 12px; border-radius: 999px;
    margin-bottom: 18px;
  }

  h1.q {
    font-size: clamp(22px, 3.4vw, 32px);
    line-height: 1.28; margin: 0 0 10px; font-weight: 800; letter-spacing: -0.01em;
  }
  .q-help { font-size: 14.5px; color: var(--mid); margin: 0 0 22px; line-height: 1.55; }

  textarea.answer {
    width: 100%; min-height: 130px; resize: vertical;
    font: inherit; font-size: 16px; line-height: 1.5;
    padding: 16px 18px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--paper); color: var(--ink);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  textarea.answer:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-wash); }
  textarea.answer::placeholder { color: #b7b6b2; }

  input.txt, select.sel {
    width: 100%; font: inherit; font-size: 16px;
    padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--paper); color: var(--ink);
    appearance: none; -webkit-appearance: none;
  }
  select.sel {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%236b6a6d' stroke-width='1.6' fill='none' fill-rule='evenodd' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat; background-position: right 16px center; padding-right: 40px;
  }
  input.txt:focus, select.sel:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-wash); }

  .field-row { display: grid; gap: 14px; margin-bottom: 16px; }
  .field-row label { font-size: 13px; font-weight: 700; color: var(--mid); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; display: block; }

  .hint-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12.5px; color: #a5a4a0; }

  .nav-row { display: flex; gap: 10px; margin-top: 26px; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 10px;
    padding: 13px 24px; font-weight: 700; font-size: 14.5px;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  button:active { transform: scale(0.98); }
  .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 4px 14px rgba(179,73,47,0.28); }
  .btn-primary:hover { background: var(--brand-dark); }
  .btn-ghost { background: transparent; color: var(--mid); border: 1.5px solid var(--line); }
  .btn-ghost:hover { border-color: var(--mid); color: var(--ink); }
  .btn-skip { background: transparent; color: #a5a4a0; font-weight: 600; padding: 13px 10px; }
  .btn-skip:hover { color: var(--mid); text-decoration: underline; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .kbd-hint { font-size: 11.5px; color: #b7b6b2; margin-top: 14px; }
  .kbd-hint kbd { background: var(--wash); border-radius: 4px; padding: 1px 6px; font-family: inherit; }

  .intro h1 { font-size: clamp(26px, 4vw, 38px); margin: 0 0 14px; font-weight: 800; letter-spacing: -0.01em; }
  .intro p.lead { font-size: 16px; color: var(--mid); line-height: 1.6; margin: 0 0 28px; max-width: 560px; }
  .intro .notice {
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; font-size: 13.5px; color: var(--mid); line-height: 1.55; margin-bottom: 26px;
    display: flex; gap: 10px;
  }
  .intro .notice .ico { flex: none; font-size: 16px; }

  /* Scale (nota 0-10) */
  .scale-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .scale-btn {
    flex: 1 1 auto; min-width: 40px; text-align: center;
    padding: 12px 0; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--paper); color: var(--ink); font-weight: 700; font-size: 15px;
    cursor: pointer; transition: all .12s ease;
  }
  .scale-btn:hover { border-color: var(--brand); }
  .scale-btn.selected { background: var(--brand); border-color: var(--brand); color: #fff; }
  .scale-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--mid); margin-top: 6px; }

  .review-list { display: grid; gap: 14px; margin: 22px 0 26px; }
  .review-item {
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    cursor: pointer; transition: border-color .15s ease;
  }
  .review-item:hover { border-color: var(--brand); }
  .review-item .rq { font-size: 12.5px; font-weight: 700; color: var(--brand-dark); margin-bottom: 4px; }
  .review-item .ra { font-size: 14.5px; color: var(--ink); line-height: 1.5; white-space: pre-wrap; }
  .review-item .ra.empty { color: #b7b6b2; font-style: italic; }
  .review-item .redit { float: right; font-size: 12px; color: var(--mid); font-weight: 600; }

  .success { text-align: center; }
  .success .big-check {
    width: 74px; height: 74px; border-radius: 50%; background: var(--brand-wash); color: var(--brand-dark);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; font-size: 34px;
  }
  .success h1 { font-size: 26px; margin: 0 0 12px; }
  .success p { color: var(--mid); font-size: 15px; line-height: 1.6; max-width: 460px; margin: 0 auto; }

  .status-line { font-size: 12.5px; color: var(--mid); margin-top: 14px; text-align: center; }
  .status-line.err { color: var(--danger); }

  @media (max-width: 560px) {
    .brandbar { padding: 12px 16px; }
    .stage { padding: 100px 16px 30px; }
  }
</style>
</head>

<script>
(function(){

  /* ==========================================================
     1) CONFIGURAÇÃO: cole aqui a URL do Apps Script depois de
     publicar o backend (veja o guia de configuração).
     ========================================================== */
  const API_URL = "https://script.google.com/macros/s/AKfycbxP0s3ahjf7gFHw6Ngb8a6Z9WtR_UBMpuQUanDAwKSRELj97jDMXP3Tl4ydz0XFXBB1tQ/exec";

  /* ==========================================================
     2) LÍDERES: substitua pelos 16 nomes reais antes de enviar
     o link. Mantenha em ordem alfabética se preferir.
     ========================================================== */
  const LIDERES = [
    "Alexandre O Braga", "Benicio Ferreira da Cruz", "Clara de Lemos Ferreira Scheidegger Araujo",
    "Daisyluiza Garcia de Figueiredo Resinente", "Douglas Queiroz", "Diego Bizzo Botelho",
    "Eduardo de Andrade Braga", "Fabrício Fernandes de Souza Reis", "Fernando Camargo Soares Neto",
    "Filipe Guimarães", "Jéssica de Souza Borges", "Joelma Braga", "Liandro Francisco da Silva",
    "Luiz Eduardo da Silva Brito", "Marcela Zambrotti", "Marcelo de Oliveira Castro",
    "Marcelo Paiva", "Marcus Vinicius do Amaral Ferraz", "Nicolas Scheidegger Araujo",
    "Priscila Nielle", "Renata Marins e Freitas Queiroz", "Tatiana Cardoso Magis Cruz",
    "Tereza Cristina Gonçalves da Silva", "Tracy Maria Costa Botelho"
  ];

  const TRILHAS = [
    "Trilha 1 · Igrejas Missionais, Igrejas Saudáveis (Mike Goheen)",
    "Trilha 2 · Líderes Missionais, Líderes Saudáveis (Timothy Sheridan)",
    "Trilha 3 · Bastidores da Kensington: Visão, Valores e Estratégias (Brian Mowrey e Time da Kensington)",
    "Trilha 4 · Plantando e Desenvolvendo Igrejas Saudáveis (João Paulo, Rafael Nunes, Carlos Miranda)",
    "Trilha 5 · Práticas Invisíveis, Resultados Visíveis (Pedro Lione, Luiza Nazareth, Pedro Filizola)",
    "Trilha 6 · \"Cuida de ti mesmo\": um imperativo não obedecido (Pedro Galoza, Alexandre Sena, Ricardo Costa)",
    "Trilha 7 · O Fator Mulher na Saúde da Família e da Comunidade (Sonia Agreste, Raquel Altafini, Juliana Lenço)"
  ];

  const DIAS = [
    { id: "terca",  label: "Terça · A Pessoa" },
    { id: "quarta", label: "Quarta · O Líder" },
    { id: "quinta", label: "Quinta · A Igreja" },
    { id: "encerramento", label: "Encerramento" }
  ];

  // Preletores confirmados na programação oficial (4 preleções + 1 painel por dia).
  // "painel" é o momento de entrevista ao vivo, sem preletor fixo.
  const TERCA_ITENS = [
    { nome: "Pedro Galoza",  kind: "palestra" },
    { nome: "Tim Sheridan",  kind: "palestra" },
    { nome: "Painel",        kind: "painel"   },
    { nome: "Roberto Aylmer",kind: "palestra" },
    { nome: "Pedro Dulci",   kind: "palestra" }
  ];
  const QUARTA_ITENS = [
    { nome: "Gui Franco",     kind: "palestra" },
    { nome: "Brian Mowrey",   kind: "palestra" },
    { nome: "Painel",         kind: "painel"   },
    { nome: "Luiza Nazareth", kind: "palestra" },
    { nome: "Ziel Machado",   kind: "palestra" }
  ];
  const QUINTA_ITENS = [
    { nome: "Carol Bazzo",         kind: "palestra" },
    { nome: "Painel",              kind: "painel"   },
    { nome: "Mike Goheen",         kind: "palestra" },
    { nome: "Luis Felipe \"Pipe\"",kind: "palestra" },
    { nome: "Ricardo Agreste",     kind: "palestra" }
  ];

  function itensDoDia(diaId){
    if (diaId === "terca")  return TERCA_ITENS;
    if (diaId === "quarta") return QUARTA_ITENS;
    if (diaId === "quinta") return QUINTA_ITENS;
    return [];
  }

  /* ==========================================================
     Monta as ETAPAS do dia: uma etapa por preletor/painel (com
     campo de observação + ideia de ação), mais a trilha na quarta
     (confirmada só na quarta de manhã) e a nota final do dia.
     ========================================================== */
  function etapasDoDia(diaId){
    if (diaId === "encerramento") {
      return [
        {
          kicker: "Encerramento",
          title: "Uma palavra final",
          kind: "campos",
          auto: {},
          fields: [
            { id: "mensagem_final", el: "textarea",
              label: "Como essa semana te impactou? Uma mensagem pra levar pra igreja." },
            { id: "aplicacao_final", el: "textarea",
              label: "Como você imagina aplicar o que aprendeu, caminhando junto com a liderança da Mosaico?" }
          ]
        }
      ];
    }

    const dLabel = (DIAS.find(d => d.id === diaId) || {}).label || "";
    const steps = [];

    if (diaId === "quarta") {
      steps.push({
        kicker: "Trilha da manhã",
        title: "Sua trilha",
        kind: "campos",
        auto: {},
        fields: [
          { id: "trilha", el: "select", label: "Qual trilha você fez?",
            help: "Selecione a trilha que você participou.", options: TRILHAS },
          { id: "trilha_obs", el: "textarea", label: "O que essa trilha trouxe que mais te marcou?" },
          { id: "trilha_acao", el: "textarea", label: "Ideia de ação pra Mosaico" }
        ]
      });
    }

    itensDoDia(diaId).forEach((it, idx) => {
      const n = idx + 1;
      const ehPainel = it.kind === "painel";
      const auto = {};
      auto["item" + n + "_nome"] = it.nome;
      steps.push({
        kicker: dLabel,
        title: ehPainel ? "Painel (entrevista ao vivo)" : it.nome,
        kind: "campos",
        auto: auto,
        fields: [
          { id: "item" + n + "_obs", el: "textarea",
            label: ehPainel ? "O que mais te marcou no painel de hoje?" : ("O que " + it.nome + " trouxe que mais te marcou?") },
          { id: "item" + n + "_acao", el: "textarea", label: "Ideia de ação pra Mosaico" }
        ]
      });
    });

    steps.push({
      kicker: "Fechamento do dia",
      title: "De 0 a 10, o quanto esse dia te mexeu com você?",
      kind: "scale",
      auto: {},
      fields: [ { id: "nota" } ]
    });

    return steps;
  }

  let STEPS = [];
  let TOTAL_STEPS = 0;

  const state = {
    step: -1,       // -1 = intro, 0..N-1 = etapas, N = revisão, N+1 = sucesso
    nome: "",
    diaId: "",
    respostas: {}
  };

  const card = document.getElementById("card");
  const progressFill = document.getElementById("progressFill");
  const stepLbl = document.getElementById("stepLbl");

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function diaLabel(){
    const d = DIAS.find(d => d.id === state.diaId);
    return d ? d.label : "";
  }

  function updateProgress(){
    if (state.step < 0) { progressFill.style.width = "0%"; stepLbl.textContent = ""; return; }
    if (state.step >= TOTAL_STEPS) { progressFill.style.width = "100%"; stepLbl.textContent = ""; return; }
    const pct = Math.round(((state.step) / TOTAL_STEPS) * 100);
    progressFill.style.width = pct + "%";
    stepLbl.textContent = "Etapa " + (state.step + 1) + " de " + TOTAL_STEPS;
  }

  function renderIntro(){
    card.className = "card intro";
    card.innerHTML = `
      <div class="kicker">Ressurgência 2026</div>
      <h1>Diário de bordo dos líderes</h1>
      <p class="lead">Todo dia, ao final do encontro na casa, reserve uns minutos pra registrar o que marcou você.
      Ore e faça suas reflexões com calma. Isso vai virar material real pra igreja depois.</p>
      <div class="notice"><span class="ico">🙏</span>
      <span>As respostas são identificadas pelo seu nome, pra sabermos quem falou o quê e podermos usar isso
      no planejamento de liderança da Mosaico depois da viagem.</span>
      </div>
      <div class="field-row">
        <div>
          <label for="fNome">Seu nome</label>
          <select class="sel" id="fNome">
            <option value="">Selecione...</option>
            ${LIDERES.map(n => `<option value="${esc(n)}" ${state.nome===n?"selected":""}>${esc(n)}</option>`).join("")}
          </select>
        </div>
        <div>
          <label for="fDia">Qual dia você está registrando?</label>
          <select class="sel" id="fDia">
            <option value="">Selecione...</option>
            ${DIAS.map(d => `<option value="${esc(d.id)}" ${state.diaId===d.id?"selected":""}>${esc(d.label)}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="nav-row">
        <button class="btn-primary" id="btnStart">Começar</button>
      </div>
    `;
    document.getElementById("btnStart").addEventListener("click", () => {
      const nome = document.getElementById("fNome").value;
      const diaId = document.getElementById("fDia").value;
      if (!nome) { document.getElementById("fNome").focus(); document.getElementById("fNome").style.borderColor = "var(--danger)"; return; }
      if (!diaId) { document.getElementById("fDia").focus(); document.getElementById("fDia").style.borderColor = "var(--danger)"; return; }
      state.nome = nome;
      state.diaId = diaId;
      state.respostas = {};
      STEPS = etapasDoDia(diaId);
      TOTAL_STEPS = STEPS.length;
      state.step = 0;
      render();
    });
  }

  function renderScaleWidget(val){
    let html = `<div class="scale-row">`;
    for (let i = 0; i <= 10; i++){
      html += `<div class="scale-btn${val===String(i)?" selected":""}" data-val="${i}">${i}</div>`;
    }
    html += `</div><div class="scale-labels"><span>nada</span><span>muito</span></div>`;
    return html;
  }

  function renderStep(){
    card.className = "card";
    const step = STEPS[state.step];
    const isScale = step.kind === "scale";

    let bodyHtml;
    if (isScale) {
      const val = state.respostas["nota"] || "";
      bodyHtml = renderScaleWidget(val);
    } else {
      bodyHtml = (step.note ? `<div class="notice"><span class="ico">🙏</span><span>${esc(step.note)}</span></div>` : "") +
        `<div class="field-row">` + step.fields.map(f => {
        const val = state.respostas[f.id] || "";
        if (f.el === "select") {
          return `<div>
            <label for="f_${f.id}">${esc(f.label)}</label>
            <select class="sel" id="f_${f.id}">
              <option value="">Selecione...</option>
              ${f.options.map(o => `<option value="${esc(o)}" ${val===o?"selected":""}>${esc(o)}</option>`).join("")}
            </select>
            ${f.help ? `<div class="hint-row"><span>${esc(f.help)}</span></div>` : ""}
          </div>`;
        }
        return `<div>
          <label for="f_${f.id}">${esc(f.label)}</label>
          <textarea class="answer" id="f_${f.id}" placeholder="Escreva livremente...">${esc(val)}</textarea>
        </div>`;
      }).join("") + `</div>`;
    }

    card.innerHTML = `
      <div class="kicker">${esc(step.kicker)}</div>
      <h1 class="q">${esc(step.title)}</h1>
      ${bodyHtml}
      <div class="nav-row">
        ${state.step > 0 ? `<button class="btn-ghost" id="btnBack">Voltar</button>` : ""}
        <button class="btn-primary" id="btnNext">${state.step === TOTAL_STEPS - 1 ? "Ir para revisão" : "Próxima"}</button>
        ${isScale ? "" : `<button class="btn-skip" id="btnSkip">Pular esta etapa</button>`}
      </div>
    `;

    if (isScale) {
      card.querySelectorAll(".scale-btn").forEach(el => {
        el.addEventListener("click", () => {
          card.querySelectorAll(".scale-btn").forEach(b => b.classList.remove("selected"));
          el.classList.add("selected");
          state.respostas["nota"] = el.dataset.val;
        });
      });
    } else {
      document.getElementById("btnSkip").addEventListener("click", () => {
        step.fields.forEach(f => { state.respostas[f.id] = ""; });
        state.step++; render();
      });
    }

    document.getElementById("btnNext").addEventListener("click", goNext);
    const backBtn = document.getElementById("btnBack");
    if (backBtn) backBtn.addEventListener("click", () => { salvarCampos(); state.step--; render(); });

    function salvarCampos(){
      if (isScale) return;
      step.fields.forEach(f => {
        const el = document.getElementById("f_" + f.id);
        if (el) state.respostas[f.id] = el.value.trim();
      });
    }

    function goNext(){
      salvarCampos();
      state.step++;
      render();
    }
  }

  function renderReview(){
    card.className = "card";
    card.innerHTML = `
      <div class="kicker">Última etapa</div>
      <h1 class="q">Antes de enviar, dá uma olhada nas suas respostas</h1>
      <p class="q-help">Clique em qualquer bloco para editar. Quando estiver tudo certo, é só enviar.</p>
      <div class="review-list">
        ${STEPS.map((step, i) => {
          let body;
          if (step.kind === "scale") {
            const v = state.respostas["nota"];
            body = `<div class="ra ${v ? "" : "empty"}">${v ? v + " / 10" : "(em branco)"}</div>`;
          } else {
            body = step.fields.map(f => {
              const a = state.respostas[f.id] || "";
              return `<div style="margin-bottom:8px;">
                <div style="font-size:12px;color:var(--mid);font-weight:600;margin-bottom:2px;">${esc(f.label)}</div>
                <div class="ra ${a ? "" : "empty"}">${a ? esc(a) : "(em branco)"}</div>
              </div>`;
            }).join("");
          }
          return `<div class="review-item" data-idx="${i}">
            <span class="redit">editar</span>
            <div class="rq">${esc(step.kicker)} · ${esc(step.title)}</div>
            ${body}
          </div>`;
        }).join("")}
      </div>
      <div class="nav-row">
        <button class="btn-ghost" id="btnBackReview">Voltar</button>
        <button class="btn-primary" id="btnSubmit">Enviar respostas</button>
      </div>
      <div class="status-line" id="statusLine"></div>
    `;
    card.querySelectorAll(".review-item").forEach(el => {
      el.addEventListener("click", () => { state.step = parseInt(el.dataset.idx, 10); render(); });
    });
    document.getElementById("btnBackReview").addEventListener("click", () => { state.step = TOTAL_STEPS - 1; render(); });
    document.getElementById("btnSubmit").addEventListener("click", submit);
  }

  function renderSuccess(){
    card.className = "card";
    card.innerHTML = `
      <div class="success">
        <div class="big-check">✓</div>
        <h1>Registrado, obrigado!</h1>
        <p>Sua visão de hoje já está guardada. Amanhã, depois do encontro na casa, volte aqui
        e registre o próximo dia.</p>
      </div>
    `;
  }

  function buildRecord(){
    const record = {
      timestamp: new Date().toISOString(),
      nome: state.nome,
      dia: diaLabel()
    };
    STEPS.forEach(step => {
      Object.keys(step.auto || {}).forEach(k => { record[k] = step.auto[k]; });
      if (step.kind === "scale") {
        record["nota"] = state.respostas["nota"] || "";
      } else {
        step.fields.forEach(f => { record[f.id] = state.respostas[f.id] || ""; });
      }
    });
    return record;
  }

  async function submit(){
    const btn = document.getElementById("btnSubmit");
    const statusLine = document.getElementById("statusLine");
    btn.disabled = true;
    btn.textContent = "Enviando...";
    statusLine.textContent = "";
    statusLine.className = "status-line";

    const record = buildRecord();

    if (!API_URL || API_URL.indexOf("COLE_AQUI") !== -1) {
      statusLine.textContent = "Aviso: URL do backend ainda não configurada, respostas não foram salvas de verdade.";
      statusLine.classList.add("err");
      btn.disabled = false;
      btn.textContent = "Enviar respostas";
      return;
    }

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "add", record: record })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Falha ao salvar");
      state.step = TOTAL_STEPS + 1;
      render();
    } catch (err) {
      statusLine.textContent = "Não foi possível enviar agora (" + err.message + "). Tente novamente.";
      statusLine.classList.add("err");
      btn.disabled = false;
      btn.textContent = "Enviar respostas";
    }
  }

  function render(){
    updateProgress();
    if (state.step < 0) renderIntro();
    else if (state.step < TOTAL_STEPS) renderStep();
    else if (state.step === TOTAL_STEPS) renderReview();
    else renderSuccess();
  }

  render();
})();
</script>
</body>
</html>
